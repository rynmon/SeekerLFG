name: Build and release

# Every push and pull request: syntax-check the Lua and make sure the TOC version has notes in
# Changelog.lua. Pushing a tag like v0.9.0 also builds SeekerLFG-0.9.0.zip and publishes a
# GitHub release with it. (No CurseForge upload yet.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - name: Syntax-check Lua files
        run: |
          for file in *.lua .github/scripts/*.lua; do
            luac5.1 -p "$file"
          done

      - name: Every Lua file the TOC loads exists
        run: |
          missing=0
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | tr -d '\r')
            case "$line" in ""|"#"*) continue ;; esac
            if [ ! -f "$line" ]; then
              echo "::error::SeekerLFG.toc loads $line, which doesn't exist"
              missing=1
            fi
          done < SeekerLFG.toc
          exit $missing

      - name: Changelog has notes for the TOC version
        run: |
          version=$(sed -n 's/^## Version: *//p' SeekerLFG.toc | tr -d '\r')
          lua5.1 .github/scripts/release-notes.lua "$version" > /dev/null
          echo "Seeker LFG $version has release notes."

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - name: Tag matches the TOC version
        id: version
        run: |
          version=$(sed -n 's/^## Version: *//p' SeekerLFG.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the TOC's ## Version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from Changelog.lua
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: lua5.1 .github/scripts/release-notes.lua "$VERSION" > release-notes.md

      - name: Build the zip
        # git archive gives one SeekerLFG/ folder with forward-slash paths, and leaves out
        # everything marked export-ignore in .gitattributes.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=SeekerLFG/ -o "dist/SeekerLFG-$VERSION.zip" HEAD
          unzip -l "dist/SeekerLFG-$VERSION.zip"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *alpha*|*beta*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/SeekerLFG-$VERSION.zip" \
            --title "Seeker LFG $VERSION" --notes-file release-notes.md $prerelease
